name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'notebook/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Continuous Integration (Lint & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit & Integration Tests
        run: |
          pytest -v

  docker-build:
    name: Build & Verify Docker Container
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t student-performance:latest .

      - name: Verify Container Health
        run: |
          docker run -d -p 8080:8080 --name app student-performance:latest
          sleep 10
          curl --fail http://localhost:8080/ || exit 1
          docker stop app

