<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EduPredict AI - Student Performance ML Analytics{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="ambient-glow"></div>

    <!-- Navigation Header -->
    <nav class="app-navbar">
        <div class="nav-container">
            <a href="{{ url_for('index') }}" class="brand">
                <div class="brand-icon">
                    <i class="bi bi-mortarboard-fill"></i>
                </div>
                <span>EduPredict <span class="brand-tag">ML v2.0</span></span>
            </a>

            <div class="nav-links">
                <a href="{{ url_for('index') }}" class="nav-link {% if request.path == '/' or request.path == '/home' %}active{% endif %}">
                    <i class="bi bi-house-door"></i> Overview
                </a>
                <a href="{{ url_for('form') }}" class="nav-link {% if request.path == '/form' %}active{% endif %}">
                    <i class="bi bi-sliders"></i> Prediction Studio
                </a>
                <a href="https://github.com/srajangowda/ASAPM-Project" target="_blank" class="nav-link nav-cta">
                    <i class="bi bi-github"></i> GitHub Repository
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="app-footer">
        <div class="footer-container">
            <div class="footer-copy">
                &copy; 2026 <strong>EduPredict AI</strong> &mdash; End-to-End Machine Learning Academic Performance Engine.
            </div>
            <div class="footer-badges">
                <span class="tech-badge"><i class="bi bi-cpu"></i> Scikit-Learn</span>
                <span class="tech-badge"><i class="bi bi-layers"></i> CatBoost &amp; XGBoost</span>
                <span class="tech-badge"><i class="bi bi-box"></i> Docker</span>
                <span class="tech-badge"><i class="bi bi-check2-circle"></i> GitHub Actions CI/CD</span>
            </div>
        </div>
    </footer>

    <!-- Client Scripts -->
    <script src="{{ url_for('static', filename='script/script.js') }}"></script>
</body>
</html>
